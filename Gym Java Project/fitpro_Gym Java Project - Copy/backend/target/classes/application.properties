# XAMPP MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/fitpro_gym?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed data (disabled: set to 'never' so data.sql does not run on every startup)
# Set to 'always' only when you want to re-seed demo data
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=false

# Server Port
server.port=8082

# App name
spring.application.name=fitpro-gym
